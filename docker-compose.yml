services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seenit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seenit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seenit -d seenit"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: https://seenit.solarezz.dev
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seenit:${POSTGRES_PASSWORD}@db:5432/seenit?schema=public
      NEXT_PUBLIC_APP_URL: https://seenit.solarezz.dev
    depends_on:
      db:
        condition: service_healthy
    # Синхронизируем схему с БД и стартуем мини-апп
    command: sh -c "npx prisma db push --skip-generate && npm start"
    # Слушаем только локально — наружу отдаёт системный nginx
    ports:
      - "127.0.0.1:3000:3000"

  bot:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: https://seenit.solarezz.dev
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seenit:${POSTGRES_PASSWORD}@db:5432/seenit?schema=public
      NEXT_PUBLIC_APP_URL: https://seenit.solarezz.dev
    depends_on:
      db:
        condition: service_healthy
    command: npx tsx src/bot/index.ts

volumes:
  pgdata:
