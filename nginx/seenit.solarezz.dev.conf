# nginx-конфиг сайта seenit.solarezz.dev → контейнер web (127.0.0.1:3100).
#
# Установка на сервере:
#   sudo cp nginx/seenit.solarezz.dev.conf /etc/nginx/sites-available/seenit.solarezz.dev
#   sudo ln -s /etc/nginx/sites-available/seenit.solarezz.dev /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Выпуск TLS (webroot-метод, не проксируется в приложение):
#   sudo certbot certonly --webroot -w /var/www/certbot -d seenit.solarezz.dev
#   sudo certbot install --nginx --cert-name seenit.solarezz.dev
#
# Требуется: DNS A-запись seenit.solarezz.dev → 77.91.79.169

server {
    listen 80;
    listen [::]:80;
    server_name seenit.solarezz.dev;

    # ACME HTTP-01 challenge — отдаём из файловой системы, НЕ в приложение.
    # Должен идти раньше location / (^~ имеет приоритет над обычным префиксом).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — на docker-контейнер web
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket / HMR (на будущее)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
