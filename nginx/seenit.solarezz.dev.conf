# nginx-конфиг сайта seenit.solarezz.dev → контейнер web (127.0.0.1:3000).
#
# Установка на сервере:
#   sudo cp nginx/seenit.solarezz.dev.conf /etc/nginx/sites-available/seenit.solarezz.dev
#   sudo ln -s /etc/nginx/sites-available/seenit.solarezz.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем выпустить TLS-сертификат (certbot сам допишет 443-блок и редирект):
#   sudo certbot --nginx -d seenit.solarezz.dev
#
# Требуется: DNS A-запись seenit.solarezz.dev → 77.91.79.169

server {
    listen 80;
    listen [::]:80;
    server_name seenit.solarezz.dev;

    # Проксируем на локальный порт, который публикует docker-контейнер web
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket / HMR (на будущее)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
