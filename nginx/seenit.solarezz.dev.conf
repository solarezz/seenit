# nginx-конфиг сайта seenit.solarezz.dev → контейнер web (127.0.0.1:3100).
#
# ВАЖНО: слушаем именно 77.91.79.169:80/443 (конкретный IP), как остальные сайты
# на этом сервере. Если поставить просто `listen 80`, запрос попадёт в другую
# группу сокетов и его перехватит default_server другого сайта → 404.
#
# Порядок установки (сертификат должен существовать до включения 443-блока):
#   1) временно оставить только 80-блок (закомментировать 443), выпустить сертификат:
#        sudo certbot certonly --webroot -w /var/www/certbot -d seenit.solarezz.dev
#   2) включить 443-блок, sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A-запись seenit.solarezz.dev → 77.91.79.169

server {
    listen 77.91.79.169:80;
    server_name seenit.solarezz.dev;

    # ACME HTTP-01 challenge — из файловой системы, не в приложение.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 77.91.79.169:443 ssl http2;
    server_name seenit.solarezz.dev;

    ssl_certificate     /etc/letsencrypt/live/seenit.solarezz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seenit.solarezz.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
